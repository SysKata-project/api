      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error415:
      description: Expected application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error429:
      description: Rate limit; honor Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        Retry-After:
          description: Seconds before retry.
          schema:
            type: integer
            minimum: 1
    Error503:
      description: Infrastructure unavailable; no learner penalty.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        Retry-After:
          description: Seconds before retry.
          schema:
            type: integer
            minimum: 1
