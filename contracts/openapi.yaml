            schema:
              $ref: '#/components/schemas/DeletionRequest'
components:
  securitySchemes:
    LearnerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak learner access token; validate issuer, signature, expiry
        and syskata-api audience; enforce active account and resource ownership.
    WorkerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dedicated Keycloak service-account access token with syskata-assessment-results
        audience and assessment-result-writer role; deny learner principals. Bind
        worker to persisted dispatch assignment.
  parameters:
    session_id:
      name: session_id
      in: path
      required: true
      schema: &id001
        type: string
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$
    attempt_id:
      name: attempt_id
      in: path
      required: true
      schema: *id001
    lab_session_id:
      name: lab_session_id
      in: path
      required: true
      schema: *id001
    assessment_id:
      name: assessment_id
      in: path
      required: true
      schema: *id001
    journey_id:
      name: journey_id
      in: path
      required: true
      schema: *id001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'Persist a UUID per logical mutation. Scope: authenticated subject,
        HTTP method and concrete path. See docs/api-contract.md for replay ordering
        and retention.'
  schemas:
    Id: *id001
    Version:
      type: string
      pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    Versions:
      type: object
      properties:
        schema_version:
          const: 1.0.0
        bundle_version:
          $ref: '#/components/schemas/Version'
        policy_version:
          const: 1.0.0
      required:
      - schema_version
      - bundle_version
      - policy_version
      additionalProperties: false
    Content_id:
      type: string
      pattern: ^[a-z][a-z0-9]*([.-][a-z0-9]+)*$
    Content_source:
      type: object
      properties:
        baseline:
          type: string
          minLength: 1
        reviewed_on:
          type: string
          format: date
        reference_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
      required:
      - baseline
      - reviewed_on
      - reference_ids
      additionalProperties: false
    Content_runtime:
      type: object
      properties:
        product:
          const: openshift
        curriculum_version:
          const: '4.22'
        tested_versions:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
          uniqueItems: true
        requirements:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
          uniqueItems: true
      required:
      - product
      - curriculum_version
      - tested_versions
      - requirements
      additionalProperties: false
    Content_option:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Content_id'
        text:
          type: string
          minLength: 1
      required:
      - id
      - text
      additionalProperties: false
    Content_reference:
      type: object
      properties:
        kind:
          const: reference
        id:
          $ref: '#/components/schemas/Content_id'
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
          pattern: ^https://
        baseline:
          type: string
          minLength: 1
        reviewed_on:
          type: string
          format: date
      required:
      - kind
      - id
      - revision
      - title
      - url
      - baseline
      - reviewed_on
      additionalProperties: false
    Content_skill:
      type: object
      properties:
        kind:
          const: skill
        id:
          $ref: '#/components/schemas/Content_id'
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        prerequisites:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 0
          uniqueItems: true
        source:
          $ref: '#/components/schemas/Content_source'
      required:
      - kind
      - id
      - revision
      - title
      - description
      - prerequisites
      - source
      additionalProperties: false
    Content_journey:
      type: object
      properties:
        kind:
          const: journey
        id:
          $ref: '#/components/schemas/Content_id'
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        locale:
          type: string
          pattern: ^[a-z]{2}(-[A-Z]{2})?$
        prerequisites:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 0
          uniqueItems: true
        unit_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
        source:
          $ref: '#/components/schemas/Content_source'
        runtime:
          $ref: '#/components/schemas/Content_runtime'
      required:
      - kind
      - id
      - revision
      - title
      - locale
      - prerequisites
      - unit_ids
      - source
      - runtime
      additionalProperties: false
    Content_unit:
      type: object
      properties:
        kind:
          const: unit
        id:
          $ref: '#/components/schemas/Content_id'
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        prerequisites:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 0
          uniqueItems: true
        lesson_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
        source:
          $ref: '#/components/schemas/Content_source'
      required:
      - kind
      - id
      - revision
      - title
      - prerequisites
      - lesson_ids
      - source
      additionalProperties: false
    Content_lesson:
      type: object
      properties:
        kind:
          const: lesson
        id:
          $ref: '#/components/schemas/Content_id'
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        prerequisites:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 0
          uniqueItems: true
        objectives:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/Content_id'
              description:
                type: string
                minLength: 1
              skill_ids:
                type: array
                items:
                  $ref: '#/components/schemas/Content_id'
                minItems: 1
                uniqueItems: true
            required:
            - id
            - description
            - skill_ids
            additionalProperties: false
          minItems: 1
          uniqueItems: true
        exercise_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
        estimated_minutes:
          type: integer
          minimum: 1
        explanation_markdown:
          type: string
          minLength: 1
        review_prompt:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/Content_source'
      required:
      - kind
      - id
      - revision
      - title
      - prerequisites
      - objectives
      - exercise_ids
      - estimated_minutes
      - explanation_markdown
      - review_prompt
      - source
      additionalProperties: false
    Content_single_choice:
      type: object
      properties:
        kind:
          const: exercise
        id:
          $ref: '#/components/schemas/Content_id'
        revision:
          type: integer
          minimum: 1
        type:
          const: single_choice
        skill_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
        objective_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
        prompt:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/Content_source'
        options:
          type: array
          items:
            $ref: '#/components/schemas/Content_option'
          minItems: 2
          uniqueItems: true
        hint_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          maxItems: 1000
          uniqueItems: true
      required:
      - kind
      - id
      - revision
      - type
      - skill_ids
      - objective_ids
      - prompt
      - source
      - options
      - hint_ids
      additionalProperties: false
    Content_command_order:
      type: object
      properties:
        kind:
          const: exercise
        id:
          $ref: '#/components/schemas/Content_id'
        revision:
          type: integer
          minimum: 1
        type:
          const: command_order
        skill_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
        objective_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
        prompt:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/Content_source'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Content_option'
          minItems: 2
          uniqueItems: true
        hint_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          maxItems: 1000
          uniqueItems: true
      required:
      - kind
      - id
      - revision
      - type
      - skill_ids
      - objective_ids
      - prompt
      - source
      - steps
      - hint_ids
      additionalProperties: false
    Content_command_entry:
      type: object
      properties:
        kind:
          const: exercise
        id:
          $ref: '#/components/schemas/Content_id'
        revision:
          type: integer
          minimum: 1
        type:
          const: command_entry
        skill_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
        objective_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
        prompt:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/Content_source'
        hint_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          maxItems: 1000
          uniqueItems: true
      required:
      - kind
      - id
      - revision
      - type
      - skill_ids
      - objective_ids
      - prompt
      - source
      - hint_ids
      additionalProperties: false
    Content_lab_task:
      type: object
      properties:
        kind:
          const: exercise
        id:
          $ref: '#/components/schemas/Content_id'
        revision:
          type: integer
          minimum: 1
        type:
          const: lab_task
        skill_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
        objective_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          uniqueItems: true
        prompt:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/Content_source'
        runtime:
          $ref: '#/components/schemas/Content_runtime'
        reset_behavior:
          const: new-generation
        hint_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 1
          maxItems: 1000
          uniqueItems: true
      required:
      - kind
      - id
      - revision
      - type
      - skill_ids
      - objective_ids
      - prompt
      - source
      - runtime
      - reset_behavior
      - hint_ids
      additionalProperties: false
    Question:
      oneOf:
      - $ref: '#/components/schemas/Content_single_choice'
      - $ref: '#/components/schemas/Content_command_order'
      - $ref: '#/components/schemas/Content_command_entry'
      - $ref: '#/components/schemas/Content_lab_task'
    Catalog:
      type: object
      properties:
        versions:
          $ref: '#/components/schemas/Versions'
        journeys:
          type: array
          items:
            $ref: '#/components/schemas/Content_journey'
          minItems: 0
          maxItems: 1000
          uniqueItems: true
        references:
          type: array
          items:
            $ref: '#/components/schemas/Content_reference'
          minItems: 0
          maxItems: 1000
          uniqueItems: true
      required:
      - versions
      - journeys
      - references
      additionalProperties: false
    EnrollmentRequest:
      type: object
      properties:
        journey_id:
          $ref: '#/components/schemas/Content_id'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - journey_id
      - timezone
      additionalProperties: false
    Enrollment:
      type: object
      properties:
        enrollment_id: *id001
        journey_id:
          $ref: '#/components/schemas/Content_id'
        created_at: &id005
          type: string
          format: date-time
        timezone:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - enrollment_id
      - journey_id
      - created_at
      - timezone
      additionalProperties: false
    LessonNode:
      type: object
      properties:
        lesson:
          $ref: '#/components/schemas/Content_lesson'
        status:
          type: string
          enum:
          - locked
          - available
          - completed
        unmet_prerequisite_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 0
          maxItems: 1000
          uniqueItems: true
      required:
      - lesson
      - status
      - unmet_prerequisite_ids
      additionalProperties: false
    JourneyPath:
      type: object
      properties:
        versions:
          $ref: '#/components/schemas/Versions'
        journey:
          $ref: '#/components/schemas/Content_journey'
        units:
          type: array
          items:
            $ref: '#/components/schemas/Content_unit'
          minItems: 0
          maxItems: 1000
          uniqueItems: true
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonNode'
          minItems: 0
          maxItems: 1000
          uniqueItems: true
        references:
          type: array
          items:
            $ref: '#/components/schemas/Content_reference'
          minItems: 0
          maxItems: 1000
          uniqueItems: true
      required:
      - versions
      - journey
      - units
      - lessons
      - references
      additionalProperties: false
    SessionRequest:
      type: object
      properties:
        journey_id:
          $ref: '#/components/schemas/Content_id'
        mode:
          type: string
          enum:
          - auto
          - lesson
          - review
        lesson_id:
          anyOf:
          - $ref: '#/components/schemas/Content_id'
          - type: 'null'
      required:
      - journey_id
      - mode
      - lesson_id
      additionalProperties: false
      description: lesson_id is required and non-null only for mode=lesson; otherwise
        null. Resume the active session in this journey before selection.
      allOf:
      - if:
          properties:
            mode:
              const: lesson
        then:
          properties:
            lesson_id:
              $ref: '#/components/schemas/Content_id'
        else:
          properties:
            lesson_id:
              type: 'null'
    Assistance:
      type: object
      properties:
        hint_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 0
          maxItems: 1000
          uniqueItems: true
        revealed: &id003
          type: boolean
      required:
      - hint_ids
      - revealed
      additionalProperties: false
    Attempt:
      type: object
      properties:
        attempt_id: *id001
        exercise_instance_id: *id001
        status:
          type: string
          enum:
          - open
          - submitted
          - awaiting_assessment
          - cancelled
        assistance:
          $ref: '#/components/schemas/Assistance'
      required:
      - attempt_id
      - exercise_instance_id
      - status
      - assistance
      additionalProperties: false
    Instance:
      type: object
      properties:
        exercise_instance_id: *id001
        question:
          $ref: '#/components/schemas/Question'
        evaluator:
          $ref: '#/components/schemas/Content_id'
        evaluator_version: &id002
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - exercise_instance_id
      - question
      - evaluator
      - evaluator_version
      additionalProperties: false
    Session:
      type: object
      properties:
        session_id: *id001
        journey_id:
          $ref: '#/components/schemas/Content_id'
        lesson_id:
          anyOf:
          - $ref: '#/components/schemas/Content_id'
          - type: 'null'
        mode:
          type: string
          enum:
          - lesson
          - review
        status:
          type: string
          enum:
          - active
          - completed
        revision: *id002
        versions:
          $ref: '#/components/schemas/Versions'
        current_instance:
          anyOf:
          - $ref: '#/components/schemas/Instance'
          - type: 'null'
        current_attempt:
          anyOf:
          - $ref: '#/components/schemas/Attempt'
          - type: 'null'
        pending_objective_ids:
          type: array
          items:
            $ref: '#/components/schemas/Content_id'
          minItems: 0
          maxItems: 1000
          uniqueItems: true
        references:
          type: array
          items:
            $ref: '#/components/schemas/Content_reference'
          minItems: 0
          maxItems: 1000
          uniqueItems: true
      required:
      - session_id
      - journey_id
      - lesson_id
      - mode
      - status
      - revision
      - versions
      - current_instance
      - current_attempt
      - pending_objective_ids
      - references
      additionalProperties: false
      allOf:
      - if:
          properties:
            status:
              const: completed
        then:
          properties:
            current_instance:
              type: 'null'
            current_attempt:
              type: 'null'
            pending_objective_ids:
              maxItems: 0
        else:
          properties:
            current_instance:
              $ref: '#/components/schemas/Instance'
    StartAttemptRequest:
      type: object
      properties:
        session_revision: *id002
        exercise_instance_id: *id001
      required:
      - session_revision
      - exercise_instance_id
      additionalProperties: false
    AttemptStarted:
      type: object
      properties:
        attempt:
          $ref: '#/components/schemas/Attempt'
        session_revision: *id002
      required:
      - attempt
      - session_revision
      additionalProperties: false
    HintRequest:
      type: object
      properties:
        session_revision: *id002
        hint_id:
          $ref: '#/components/schemas/Content_id'
      required:
      - session_revision
      - hint_id
      additionalProperties: false
    RevisionRequest:
      type: object
      properties:
        session_revision: *id002
      required:
      - session_revision
      additionalProperties: false
    AssistanceResponse:
      type: object
      properties:
        attempt_id: *id001
        assistance:
          $ref: '#/components/schemas/Assistance'
        text_markdown:
          type: string
          minLength: 1
          maxLength: 20000
        session_revision: *id002
      required:
      - attempt_id
      - assistance
