  /v1/me/account-deletion:
    post:
      operationId: deleteAccount
      summary: Accept deletion and immediately disable account access
      description: Persist deletion job and original 30-day deadline; disable API
        access immediately including otherwise-valid tokens, revoke identity sessions
        and lab/terminal access. Subsequent calls are forbidden, including retries;
        see deletion recovery contract.
      tags:
      - Learner API
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
