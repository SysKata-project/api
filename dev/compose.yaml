services:
  database:
    image: docker.io/library/postgres:17.11
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set a local admin password}
      SYSKATA_DB_PASSWORD: ${SYSKATA_DB_PASSWORD:?Set the application password}
      SYSKATA_EVIDENCE_PASSWORD: ${SYSKATA_EVIDENCE_PASSWORD:?Set the evidence password}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set the identity database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-local.sh:/docker-entrypoint-initdb.d/init-local.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  identity:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set the identity database password}
      KC_BOOTSTRAP_ADMIN_USERNAME: syskata-local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set a local admin password}
      KC_HOSTNAME: http://localhost:8180
      KC_LOG_LEVEL: ERROR
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./syskata-realm.json:/opt/keycloak/data/import/syskata-realm.json:ro
    depends_on:
      database:
        condition: service_healthy
volumes:
  database:
