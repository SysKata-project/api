name: Mobile identity
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  https:
    name: HTTPS mobile identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify isolated TLS and native callback contract
        run: python3 scripts/verify-mobile-identity.py
