name: Java quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Java verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
          cache: maven
      - name: Compile, test and enforce quality gates
        run: ./mvnw -B -ntp clean verify
      - name: Prove gate rejection and recovery
        run: python3 scripts/prove-quality-gates.py
      - name: Upload test and quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-quality-reports
          retention-days: 7
          path: |
            target/surefire-reports/*.xml
            target/site/jacoco/
            target/pmd.xml
            target/cpd.xml
            target/checkstyle-result.xml
            target/gate-evidence/summary.json
