quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SYSKATA_DB_URL}
quarkus.datasource.username=${SYSKATA_DB_USER}
quarkus.datasource.password=${SYSKATA_DB_PASSWORD}
quarkus.datasource.devservices.enabled=false
quarkus.datasource.evidence.db-kind=postgresql
quarkus.datasource.evidence.jdbc.url=${SYSKATA_EVIDENCE_URL}
quarkus.datasource.evidence.username=${SYSKATA_EVIDENCE_USER}
quarkus.datasource.evidence.password=${SYSKATA_EVIDENCE_PASSWORD}
quarkus.datasource.evidence.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.evidence.migrate-at-start=true
quarkus.flyway.evidence.locations=db/evidence
quarkus.flyway.evidence.clean-disabled=true
quarkus.oidc.auth-server-url=${SYSKATA_OIDC_ISSUER}
quarkus.oidc.client-id=syskata-api
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=syskata-api
quarkus.oidc.token.token-type=Bearer
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.keycloak.devservices.enabled=false
quarkus.http.limits.max-body-size=1M
quarkus.http.access-log.enabled=false
quarkus.http.auth.proactive=false
quarkus.jackson.fail-on-unknown-properties=true
quarkus.log.category."io.quarkus.oidc".level=OFF
quarkus.log.category."org.flywaydb".level=WARN
