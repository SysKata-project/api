quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SYSKATA_DB_URL}
quarkus.datasource.username=${SYSKATA_DB_USER}
quarkus.datasource.password=${SYSKATA_DB_PASSWORD}
quarkus.datasource.devservices.enabled=false
quarkus.datasource.evidence.db-kind=postgresql
quarkus.datasource.evidence.jdbc.url=${SYSKATA_EVIDENCE_URL}
quarkus.datasource.evidence.username=${SYSKATA_EVIDENCE_USER}
quarkus.datasource.evidence.password=${SYSKATA_EVIDENCE_PASSWORD}
quarkus.datasource.evidence.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.evidence.migrate-at-start=true
quarkus.flyway.evidence.locations=db/evidence
quarkus.flyway.evidence.clean-disabled=true
quarkus.oidc.auth-server-url=${SYSKATA_OIDC_ISSUER}
quarkus.oidc.client-id=syskata-api
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=syskata-api
quarkus.oidc.token.token-type=Bearer
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.keycloak.devservices.enabled=false
quarkus.http.limits.max-body-size=1M
quarkus.http.access-log.enabled=false
quarkus.http.auth.proactive=false
quarkus.jackson.fail-on-unknown-properties=true
quarkus.log.category."io.quarkus.oidc".level=OFF
quarkus.log.category."org.flywaydb".level=WARN
# Separate audience and role boundary for evaluator callbacks.
quarkus.oidc.results.auth-server-url=${SYSKATA_OIDC_ISSUER}
quarkus.oidc.results.client-id=syskata-assessment-results
quarkus.oidc.results.application-type=service
quarkus.oidc.results.token.audience=syskata-assessment-results
quarkus.oidc.results.token.token-type=Bearer
quarkus.oidc.results.token.principal-claim=sub
quarkus.oidc.results.token.allow-jwt-introspection=false
quarkus.oidc.results.token.allow-opaque-token-introspection=false
quarkus.oidc.results.roles.role-claim-path=realm_access/roles
quarkus.oidc.results.tenant-paths=/internal/v1/assessments/*
syskata.labs.url=${SYSKATA_LABS_URL:https://unconfigured.invalid}
syskata.labs.token=${SYSKATA_LABS_TOKEN:unconfigured}
syskata.labs.terminal-url=${SYSKATA_TERMINAL_URL:wss://unconfigured.invalid}
syskata.labs.worker-subject=${SYSKATA_ASSESSMENT_WORKER_SUBJECT:unconfigured}
# Build dispatch entry point separately; never expose its HTTP endpoints.
%dispatch.quarkus.http.host=127.0.0.1
%dispatch.quarkus.http.port=8091
%dispatch.quarkus.http.auth.permission.worker.paths=/*
%dispatch.quarkus.http.auth.permission.worker.policy=deny
%dispatch.quarkus.oidc.tenant-enabled=false
%dispatch.quarkus.oidc.results.tenant-enabled=false
